# Manual entrants: hand-designed baseline fingers scored alongside every search arm.
# Load with rtt.design.schema.load_entrants("configs/entrants.yaml").
# straight, concave and hooked share length 80 mm, thickness 10 mm, width 20 mm and no
# taper, so each differs from the straight baseline in exactly one design idea.
# stock approximates the stock finger of the open-source parallel gripper the task's
# gripper matches (configs/task_v1.yaml), so it is the "what you get out of the box"
# baseline. On screen it is "the stock finger"; the gripper is credited in the README.
entrants:
  - name: straight
    rationale: Plain parallel-jaw finger with a flat pad; the reference baseline.
    finger_length_mm: 80.0
    finger_thickness_mm: 10.0
    finger_width_mm: 20.0
    bend_angle_deg: 0.0
    bend_start_frac: 0.5
    inner_face: flat
    inner_face_depth_mm: 0.0
    tip_profile: blunt
    tip_size_mm: 0.0
    taper_ratio: 1.0

  - name: concave
    rationale: A 4 mm recessed channel between two lips cradles cylinders and rods on two contact lines.
    finger_length_mm: 80.0
    finger_thickness_mm: 10.0
    finger_width_mm: 20.0
    bend_angle_deg: 0.0
    bend_start_frac: 0.5
    inner_face: concave_arc
    inner_face_depth_mm: 4.0
    tip_profile: blunt
    tip_size_mm: 0.0
    taper_ratio: 1.0

  - name: hooked
    rationale: A 15 degree inward bend near the tip plus an 8 mm hook lip catches under objects during the lift.
    finger_length_mm: 80.0
    finger_thickness_mm: 10.0
    finger_width_mm: 20.0
    bend_angle_deg: 15.0
    bend_start_frac: 0.7
    inner_face: flat
    inner_face_depth_mm: 0.0
    tip_profile: hook
    tip_size_mm: 8.0
    taper_ratio: 1.0

  # Box approximation of the stock clamp finger below the gripper frame [D = measured on
  # the published CAD, A = assumed]: 62.5 mm long below the frame face [D]; contact face
  # flat over its whole length [D] (the real one is recessed between the carriage and the
  # 22 mm tip pad, so tall-object grasps are overstated); width 42 -> 19 mm and depth 16 ->
  # 4.3 mm root to tip [D], fitted with 30 mm width, 8 mm thickness and taper 0.5 (the
  # generator's 4 segments are 28.1 / 24.4 / 20.6 / 16.9 mm wide; the pad is ~17 mm wide at
  # 55 mm [D]); tip corners rounded ~1 mm [D]. 10.8 g in PLA here vs ~13 g solid PETG-CF.
  - name: stock
    rationale: The gripper's stock finger, box-approximated; a flat tapered pad with a rounded tip.
    finger_length_mm: 62.5
    finger_thickness_mm: 8.0
    finger_width_mm: 30.0
    bend_angle_deg: 0.0
    bend_start_frac: 0.5
    inner_face: flat
    inner_face_depth_mm: 0.0
    tip_profile: rounded
    tip_size_mm: 1.0
    taper_ratio: 0.5
