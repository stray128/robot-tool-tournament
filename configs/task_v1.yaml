# Task v1: physics, gripper, controller and scoring constants for every entrant.
# Loaded by rtt.sim.task.load_task(); the dataclass defaults in src/rtt/sim/task.py
# mirror this file exactly (tests/test_m1_gate.py keeps them in sync).
# Units: SI (m, kg, s, N, rad) unless the key says otherwise.
#
# G1 tuning record (2026-10-15, CPU mujoco 3.15.0, straight 80 mm test finger):
# - The Newton solver needs MuJoCo's default iterations (100) / ls_iterations (50).
#   Capping them at 50 / 20 caused zero-iteration solver exits, contact loss and
#   objects launched at ~2.5 m/s; that was the main source of G1 instability.
# - Contact solref 0.004 (timeconst) with solimp (0.95, 0.99): softer contacts
#   (0.006-0.01) let rods roll out of a high (k = 0.7) grasp during the hold
#   (1-4 of 48 sanity grasps failed at 2 ms).
# - timestep: both 2 ms and 1 ms pass G1 (32 seeds x 4 cases + 96 random
#   placements, zero spurious failures). 1 ms is the default because it halves
#   contact penetration (max 0.66 vs 1.12 mm on sanity grasps; 0.68 vs 1.66 mm on
#   a 20 deg bent finger) and raised 30 % fewer penetration flags on bent and
#   hooked stress fingers. 2 ms runs ~1.75x more episodes/s; revisit at G3.
# - Joint-limit solref 0.004 keeps open fingers on their stops (the default
#   0.02 let them sag 2.5 mm past the limit). Palm yaw is in radians
#   (MjSpec compiles angles as degrees unless told otherwise).
# - grip_kv 100 (was 30): when fingers slip off an object the jaw no longer slams
#   shut at 1-3 m/s; finger-finger penetration on those failures fell from ~6 mm
#   to < 2 mm, so they are no longer mislabelled by the penetration check.
# - native_ccd false: with MuJoCo's native GJK/EPA plus multi-CCD (the 3.15
#   defaults), a cylinder pressed against the lip edges of a concave finger got
#   contact normals along the finger width (+-X) instead of radial, so ~400 N of
#   phantom wedge force held it and the squeeze along the closing axis read 0.
#   libccd (MPR) with multi-CCD gives radial normals (squeeze 20 N = F/2) and
#   still rests a cylinder on 4-5 contacts; disabling multi-CCD instead left a
#   standing cylinder on a single contact and it rocked. Box-box and
#   capsule-box pairs use dedicated colliders and are unaffected.
# - condim 4 and impratio 10 kept; condim 6 and noslip were not needed.
# - Integration (2026-10-15): the G1 cases now use generated entrant fingers and a
#   90 x 40 x 120 mm box (0.30 kg, as before) so every valid design opens around it.
#   At k = 0.5 over seeds 0-23 the straight, concave and hooked entrants succeeded 24/24;
#   too_high and too_wide gave missed_grasp 24/24 and mu = 0.05 slip_during_lift 24/24,
#   with no physics flags and at most 1.6 mm penetration. Values here are unchanged.
name: task_v1

physics:
  timestep: 0.001
  integrator: implicitfast
  cone: elliptic
  impratio: 10.0
  condim: 4
  friction: 0.8                 # sliding mu; the object geom has priority, so its mu governs its contacts
  torsional_friction: 0.005
  rolling_friction: 0.0001
  contact_solref: [0.004, 1.0]
  contact_solimp: [0.95, 0.99, 0.001, 0.5, 2.0]
  limit_solref: [0.004, 1.0]
  iterations: 100
  ls_iterations: 50
  native_ccd: false             # libccd MPR for convex pairs; native GJK/EPA + multi-CCD gave wrong edge normals
  multi_ccd: true               # several contact points per convex pair (a cylinder stands on 4-5, not 1)
  object_density: 700.0         # kg/m^3
  table_top_z: 0.0
  table_half_size: [0.4, 0.4, 0.375]

gripper:
  palm_half_size: [0.03, 0.065, 0.015]
  palm_mass: 0.4
  open_half_gap: 0.04           # finger root offset at full open: 80 mm gap for a face at local y = 0
  stroke: 0.04                  # per finger; closure q = 0 open .. 0.04 closed
  grip_force: 40.0              # F: grip actuator force limit on the mean-closure tendon (F/2 squeeze per finger)
  grip_kp: 4000.0
  grip_kv: 100.0                # overdamped: an unobstructed jaw snaps shut at <= ~0.4 m/s
  grip_overdrive: 0.01          # close target past full stroke, so the servo always saturates at F
  finger_armature: 0.02
  finger_damping: 2.0
  xy_kp: 2000.0
  xy_kv: 80.0
  xy_force: 100.0
  z_kp: 4000.0
  z_kv: 120.0
  z_force: 150.0
  yaw_kp: 20.0
  yaw_kv: 1.0
  yaw_torque: 15.0
  slide_armature: 0.05
  yaw_armature: 0.001
  equality_solref: [0.004, 1.0]

controller:
  grasp_height_fracs: [0.3, 0.5, 0.7]   # controller settings k: finger-tip height / object height
  grasp_z_offset: 0.0
  min_tip_clearance: 0.003
  approach_offset: 0.08
  approach_clearance: 0.02
  settle_time: 0.3
  descend_time: 1.0
  close_time: 1.0
  squeeze_time: 0.3
  lift_height: 0.15
  lift_time: 1.5
  open_target: -0.002
  control_period: 0.002         # 500 Hz

score:
  success_lift: 0.10
  success_hold: 2.0
  max_time: 12.0
  check_period: 0.01
  finger_table_force_max: 5.0   # N, palm or finger against table/floor
  penetration_max: 0.002
  speed_cap: 5.0
  eject_dist: 0.025
  eject_speed: 1.0
  off_table_drop: 0.05
  grasp_min_squeeze_frac: 0.25
  grasp_max_press_down_ratio: 1.0  # per finger at lift start: downward push / squeeze above this -> missed_grasp (finger on top)
  fail_settle_time: 1.0
  record_tail: 0.5

jitter:
  pos: 0.002                    # +-2 mm object x/y
  yaw_deg: 3.0                  # +-3 deg object yaw
  mu_frac: 0.10                 # +-10 % object friction

replay:
  fps: 30
