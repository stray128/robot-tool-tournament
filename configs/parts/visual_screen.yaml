# Brand screen for scanned (GSO) objects: which scans may appear TEXTURED on screen.
# Load with rtt.sim.gso_visual.load_visual_screen(); check a shot with check_shot().
#
# Rules (spec section 8, "Brand rule"):
#   * Hero and video shots show only the procedural industrial parts (rtt.parts) or scans
#     listed under `objects` with brand_visible: false (in their listed stable poses).
#   * Props are industrial parts, never scans.
#   * The site's held-out gallery renders scans untextured ("clay"), so no label can show.
#   * Any scan not listed counts as branded (default_brand_visible: true).
#
# How an object is screened: render it textured in each stable pose it may be shown in
# (rtt.sim.gso_visual.load_scan_visual, UVs flipped for MuJoCo), from 4 azimuths 5-15 deg
# above level and once from 60 deg above; clear it only if no printed text, logo, label,
# sticker or barcode is legible in any view. Record the poses and views under `method`.
# A cleared object is still shot from above its base plane only (a sticker under a base
# stays hidden only while the camera cannot see the base).
#
# Screened 2026-10-16 (the 9 textured scans available locally): none cleared. Six show
# printed labels or logos; three are mugs whose base sticker faces the camera in their
# intake pose, and every stable pose of them is over 94 mm across (the gripper opens 84 mm).
# They are listed by the SHA-256 of their full name only, so no brand name sits in this file.
# Clearing a graspable unbranded scan for the hero needs more textures fetched from the
# pinned source first (open item).
version: 1
default_brand_visible: true

objects: {}
# objects:
#   <GSO object name>:
#     brand_visible: false
#     poses: [<stable pose index>, ...]
#     method: "textured MuJoCo renders, pose k, 4 azimuths at -15 deg + 1 at -60 deg"
#     note: "<what was checked>"

