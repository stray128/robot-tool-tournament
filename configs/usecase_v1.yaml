# Use-case benchmark v1 of the Effector Lab Studio: pre-registration (DRAFT, not yet approved).
#
# Product mode: not part of the pre-registered experiment (prereg-v1 is unchanged).
# Protocol and rationale: docs/USECASE_V1.md. Driver: scripts/studio_usecase_v1.py.
#
# The founder rules on this draft before the tag `usecase-v1`. Until then nothing below runs on
# Nebius. Order after the go (docs/USECASE_V1.md section 11): freeze-arms (writes the frozen block
# at the end of this file), commit-secret (draws the secret, writes its SHA-256), finalize
# (status: frozen), commit, tag usecase-v1, evaluate, analyse, publish whatever it shows.

format: rtt-usecase-benchmark/1
label: "Product mode: not part of the pre-registered experiment"
status: frozen
tag: usecase-v1
contract: rtt-effectors/2

heroes:
  # The three frozen hero plans (tests/test_studio_engineer.py pins these task ids).
  plans: src/rtt/studio/engineer/recorded/gate-2026-10-18-s4e
  cases:
    h1_tote: e4586f3612e11b0eb490349c52a109bec75f43fdb0bcf9f1d91127f9e01a4ad5
    h2_coupling: 33599e99ac277cf20e73d6acd349b9422330a255b3fe5ea48c6442a26c3decd6
    h3_cabinet: 3297a111d7c61392e9a99a08d3a80a8e14c7046b80d277925ed3a78788ff651d

development:
  # Search and selection use only these conditions (S5's defaults, docs/STUDIO_SEARCH.md):
  # rtt.studio.runner.condition_grid(task, 8): `nominal` (seed 0, no offset) and place01..place07
  # (seeds 1..7, per-object aim offsets uniform in +-2 mm); the first 3 screen the steps.
  conditions: 8
  placement_mm: 2.0
  screen: 3
  finalists: 4
  top_k: 3
  multi_head_pairs: 6
  payload_kg: 3.0
  controllers: default

arms:
  # Every arm is frozen as a setup id (and the setup itself) in the frozen block before the tag.
  a:
    name: best single off-the-shelf effector
    rule: S5's best single off-the-shelf effector (`best_single`) of tournament b, on the development conditions
  b:
    name: Studio recommendation, full pool
    pool: [preset, library, designed, part_jaw] # every family preset, library entrant, designed effector, part-shaped jaw
    rule: S5's recommendation of tournament b
  c:
    name: Studio recommendation, library items only
    pool: [library] # the same search with the candidate pool limited to the library entrants
    rule: S5's recommendation of tournament c
  no_recommendation: >-
    A hero whose arm has no recommendation is reported descriptively with its closest setup
    (S5's no_winner.closest[0]) and excluded from the test. A hero whose arm b is arm a's setup,
    or that has no arm a, is excluded from the test too (declared at freeze, before any held-out run).

heldout:
  # 32 conditions per hero, generated from a secret seed (commit-reveal, docs/USECASE_V1.md section 6).
  conditions: 32
  placement_mm: 2.0 # per-object hidden aim offset, uniform in +-2 mm on x and y
  friction_jitter: 0.10 # drawn from each condition's seed: task_v2 jitter (mu +-10 %, aim +-0.5 mm)
  seed_floor: 1000000 # held-out seeds are at least this (the development seeds are 0..7)
  domain: rtt-usecase-v1 # sha256("rtt-usecase-v1|<task_id>|<secret>") seeds each hero's draw
  secret_file: secrets/usecase_v1_seed.txt # git-ignored; revealed with the results

analysis:
  primary: per tested hero, full-task completion rate of arm b against arm a on its 32 held-out conditions
  test: exact one-sided paired sign-flip permutation test (exact McNemar), b > a
  alpha: 0.05
  multiplicity: holm # across the tested heroes
  secondary:
    - arm b against arm c (descriptive)
    - per-step success with fidelity tiers and failure modes, per arm
    - cycle time (median of completed runs, and of all runs)
    - tool count, actuators, carried and total mass
    - parity of every arm's development runs between the laptop and the job (descriptive)
  publish: results are published whatever they show

executor:
  # Serverless Jobs through rtt.studio.cloud.NebiusExecutor on the rtt.cloud machinery.
  target: uks2-cpu # cpu-d3, uk-south2
  vcpus: 32
  fallback: true # eun1-gpu (H100) only when uk-south2 cannot start a job
  max_concurrent_jobs: 3
  expected_run_s: 900
  cap_usd: 10.0 # the benchmark's own capped ledger, over every benchmark job
  token_factory_usd: 0.0 # no job attaches the Token Factory key
  ledger: runs/cloud/usecase-v1-spend.jsonl

