<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Effector Lab architecture</title>
  <desc id="desc">A part goes through intake, NVIDIA Nemotron on Nebius Token Factory proposes designs, validators check them, Nebius Serverless AI Jobs simulate them in MuJoCo on CPU, measured results feed the next round, and the outputs are a robustness certificate, a print pack and a static replay site.</desc>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .tf { fill: #eff8f0; stroke: #2da44e; stroke-width: 1.3; }
    .ac { fill: #eef4fc; stroke: #0969da; stroke-width: 1.3; }
    .h { fill: #1f2328; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub { fill: #59636e; font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .t { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: #424a53; font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .lab { fill: #59636e; font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 0.06em; }
    .labtf { fill: #1a7f37; }
    .labac { fill: #0969da; }
    .num { fill: #0969da; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ln { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .fb { stroke: #1a7f37; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .dot { stroke: #8c959f; stroke-width: 1.2; fill: none; stroke-dasharray: 2 3; }
    .ah { fill: #57606a; }
    .ahfb { fill: #1a7f37; }
    .fbt { fill: #1a7f37; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #3d444d; }
      .tf { fill: #0f2417; stroke: #3fb950; }
      .ac { fill: #0c1d33; stroke: #4493f8; }
      .h, .t { fill: #e6edf3; }
      .sub, .lab { fill: #9198a1; }
      .s { fill: #c9d1d9; }
      .labtf, .fbt { fill: #3fb950; }
      .labac, .num { fill: #4493f8; }
      .ln { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .fb { stroke: #3fb950; }
      .ahfb { fill: #3fb950; }
      .dot { stroke: #656c76; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="ahfb" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="620" rx="10"/>

  <text class="h" x="30" y="44">Effector Lab: how a design is made and tested</text>
  <text class="sub" x="30" y="67">Every scored number comes from a Nebius Serverless AI Job running one pinned image. Everything is simulated.</text>

  <!-- 1. Your part -->
  <rect class="card" x="30" y="120" width="152" height="170" rx="6"/>
  <text class="num" x="44" y="144">1</text>
  <text class="t" x="58" y="144">Your part</text>
  <text class="s" x="44" y="170">STL, OBJ, PLY or OFF,</text>
  <text class="s" x="44" y="188">5 mm to 0.5 m</text>
  <text class="s" x="44" y="214">Intake: units, mass,</text>
  <text class="s" x="44" y="232">convex pieces,</text>
  <text class="s" x="44" y="250">resting poses,</text>
  <text class="s" x="44" y="268">test conditions</text>

  <!-- 2. Token Factory -->
  <rect class="tf" x="205" y="104" width="210" height="196" rx="8"/>
  <text class="lab labtf" x="217" y="122">NEBIUS TOKEN FACTORY</text>
  <rect class="card" x="215" y="132" width="190" height="96" rx="6"/>
  <text class="num" x="227" y="153">2</text>
  <text class="t" x="241" y="153">Nemotron 3 Super</text>
  <text class="s" x="227" y="176">proposes designs through</text>
  <text class="s" x="227" y="194">a forced tool call, and</text>
  <text class="s" x="227" y="212">runs the agent loop</text>
  <rect class="card" x="215" y="236" width="190" height="56" rx="6"/>
  <text class="t" x="227" y="256">Nemotron 3.5 Lightning</text>
  <text class="s" x="227" y="276">short step summaries</text>

  <!-- 3. Validators -->
  <rect class="card" x="438" y="120" width="152" height="170" rx="6"/>
  <text class="num" x="452" y="144">3</text>
  <text class="t" x="466" y="144">Checks</text>
  <text class="s" x="452" y="170">geometry and print</text>
  <text class="s" x="452" y="188">rules, diversity</text>
  <text class="s" x="452" y="206">screen, a repair call</text>
  <text class="s" x="452" y="232">every reply cached,</text>
  <text class="s" x="452" y="250">a dollar cap on</text>
  <text class="s" x="452" y="268">every call</text>

  <!-- 4. Nebius AI Cloud -->
  <rect class="ac" x="615" y="104" width="360" height="362" rx="8"/>
  <text class="lab labac" x="627" y="122">NEBIUS AI CLOUD</text>
  <rect class="card" x="630" y="132" width="330" height="108" rx="6"/>
  <text class="num" x="644" y="153">4</text>
  <text class="t" x="658" y="153">Serverless AI Jobs</text>
  <text class="s" x="644" y="176">uk-south2, cpu-d3: CPU MuJoCo 3.15 is the</text>
  <text class="s" x="644" y="194">executor of record. Searches, held-out</text>
  <text class="s" x="644" y="212">suites and certificates, one image by digest</text>
  <text class="s" x="644" y="230">(an H100 in eu-north1 is the fallback only)</text>

  <rect class="card" x="630" y="360" width="104" height="94" rx="6"/>
  <text class="t" x="642" y="381">Container</text>
  <text class="t" x="642" y="398">Registry</text>
  <text class="s" x="642" y="420">the pinned</text>
  <text class="s" x="642" y="437">image</text>
  <rect class="card" x="743" y="360" width="104" height="94" rx="6"/>
  <text class="t" x="755" y="381">MysteryBox</text>
  <text class="s" x="755" y="403">the Token</text>
  <text class="s" x="755" y="420">Factory key,</text>
  <text class="s" x="755" y="437">as a secret</text>
  <rect class="card" x="856" y="360" width="104" height="94" rx="6"/>
  <text class="t" x="868" y="381">Object</text>
  <text class="t" x="868" y="398">Storage</text>
  <text class="s" x="868" y="420">tables, replays,</text>
  <text class="s" x="868" y="437">manifests</text>
  <text class="s" x="644" y="272">rtt job submits the job, waits, records the</text>
  <text class="s" x="644" y="290">spend, then fetches and verifies the outputs</text>
  <path class="dot" d="M682,304 V360"/>
  <path class="dot" d="M795,304 V360"/>
  <path class="dot" d="M908,304 V360"/>

  <!-- 5. Outputs -->
  <rect class="card" x="1005" y="120" width="165" height="100" rx="6"/>
  <text class="num" x="1019" y="144">5</text>
  <text class="t" x="1033" y="144">Certificate</text>
  <text class="s" x="1019" y="168">18 tests: placement</text>
  <text class="s" x="1019" y="186">error to 3 mm, shake,</text>
  <text class="s" x="1019" y="204">push</text>
  <rect class="card" x="1005" y="236" width="165" height="100" rx="6"/>
  <text class="t" x="1019" y="260">Print pack</text>
  <text class="s" x="1019" y="284">finger and jaw STLs,</text>
  <text class="s" x="1019" y="302">certificate.html,</text>
  <text class="s" x="1019" y="320">manifest</text>
  <rect class="card" x="1005" y="352" width="165" height="102" rx="6"/>
  <text class="t" x="1019" y="376">Replay site</text>
  <text class="s" x="1019" y="400">static Next.js; plays</text>
  <text class="s" x="1019" y="418">every recorded bout</text>
  <text class="s" x="1019" y="436">in the browser</text>

  <!-- flow arrows -->
  <path class="ln" d="M182,182 H203" marker-end="url(#a)"/>
  <path class="ln" d="M405,182 H436" marker-end="url(#a)"/>
  <path class="ln" d="M585,182 H628" marker-end="url(#a)"/>
  <path class="ln" d="M960,182 H988 V170 H1003" marker-end="url(#a)"/>
  <path class="ln" d="M988,182 V286 H1003" marker-end="url(#a)"/>
  <path class="ln" d="M988,286 V403 H1003" marker-end="url(#a)"/>

  <!-- feedback loop -->
  <path class="fb" d="M630,222 H603 V330 H310 V302" marker-end="url(#af)"/>
  <text class="fbt" x="322" y="350">measured results feed the next round</text>

  <!-- bottom: what runs on it -->
  <rect class="card" x="30" y="490" width="555" height="104" rx="6"/>
  <text class="t" x="44" y="514">Pre-registered benchmark (git tag prereg-v1)</text>
  <text class="s" x="44" y="538">Nemotron with feedback against equal-budget random search: 32 runs per</text>
  <text class="s" x="44" y="556">arm, 40 designs per run, then each run's best design on held-out parts</text>
  <text class="s" x="44" y="574">that no search process could read. Results in docs/RESULTS.md.</text>
  <rect class="card" x="615" y="490" width="555" height="104" rx="6"/>
  <text class="t" x="629" y="514">Effector tournament (product mode, not pre-registered)</text>
  <text class="s" x="629" y="538">For one part: parallel-jaw fingers, open-source hands and grippers, a soft</text>
  <text class="s" x="629" y="556">arm (tentacle), a suction cup and Nemotron-designed effectors, on the same</text>
  <text class="s" x="629" y="574">placements, seeds and scorer. The top two per group are certified.</text>
</svg>
