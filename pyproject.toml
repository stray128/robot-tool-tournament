[project]
name = "robot-tool-tournament"
version = "0.1.0"
description = "Nemotron-designed robot gripper fingers, tested in physics simulation on Nebius."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.15.0",
    "mujoco-warp==3.15.0",
    "warp-lang==1.18.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "pydantic==2.14.1",
    "trimesh==5.1.1",
    "manifold3d",
    "openai==3.31.0",
    "python-dotenv==1.2.4",
    "pyyaml",
    "pandas",
    "pyarrow",
    "matplotlib",
    "boto3",
    "fastapi",
    "uvicorn",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]
tpe = ["optuna"]

[project.scripts]
rtt = "rtt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
